# Baremetal SNO (Single Node OpenShift) Hub Configuration
# This profile excludes infra-nodes and worker-nodes policies
# and configures settings appropriate for SNO deployments

# Override: Exclude policies not applicable to SNO
excludePolicies:
  - infra-nodes
  - worker-nodes

# Hub Cluster Sets with Feature Flags. Blank will remove
hubClusterSets:
  hub:
    config:
      # Images for AutoShift's own helper Jobs, which need only the oc command.
      # Blank is the right value on bare metal: each Job resolves its image from
      # this cluster's openshift/cli ImageStream, a digest against the release
      # payload that follows an ImageDigestMirrorSet and needs neither the
      # internal registry nor an ImageTagMirrorSet. That matters here because the
      # registry Operator is Removed on platforms with no default storage, so
      # image-registry.openshift-image-registry.svc does not exist at all.
      # Set a value only to pin a specific mirrored image, for example
      # 'registry.example.com:5000/openshift4/ose-cli:latest'.
      images:
        cli: ''
      # Ansible Automation Platform instance, applied when the aap label is 'true'.
      aap:
        instance:
          eda:
            disabled: false
          hub:
            storage_type: file
            file_storage_size: 10Gi
            file_storage_storage_class: ocs-storagecluster-cephfs
      # Lab: hub provisions SNO spokes over Redfish (sushy-emulator). Offer only the
      # RHCOS 4.22 image so the assisted-image-service volume can be small.
      acm:
        provisioning:
          databaseSize: 10Gi
          filesystemStorageSize: 20Gi
          imageStorageSize: 20Gi
          osImages:
            - openshiftVersion: '4.22'
              version: '9.8.20260715-1'
              cpuArchitecture: x86_64
              url: 'https://rhcos.mirror.openshift.com/art/storage/prod/streams/rhel-9.8/builds/9.8.20260715-1/x86_64/rhcos-9.8.20260715-1-live-iso.x86_64.iso'
              rootFSUrl: 'https://rhcos.mirror.openshift.com/art/storage/prod/streams/rhel-9.8/builds/9.8.20260715-1/x86_64/rhcos-9.8.20260715-1-live-rootfs.x86_64.img'
    labels:
      # OpenShift version for cluster deployment and image mirroring
      openshift-version: '4.22.18'
      self-managed: 'true'
      ### Advance Cluster Manager
      acm-subscription-name: advanced-cluster-management
      acm-channel: release-2.17
      acm-source: redhat-operators
      acm-source-namespace: openshift-marketplace
      acm-availability-config: 'Basic'
      acm-observability: 'false'
      # Metal3 Provisioning (provisioningNetwork: Disabled) so spokes boot via redfish-virtualmedia
      acm-enable-provisioning: 'true'
      # Enables the SiteConfig component on the MultiClusterHub and the cluster-install policies
      cluster-install: 'true'
      acm-search-storage: 'true'
      # acm-search-storage-class: 'ocs-storagecluster-ceph-rbd'
      # acm-search-storage-size: '100Gi'
      ### OpenShift Gitops
      gitops: 'true' # is expected to be installed on all hub clusters
      gitops-subscription-name: openshift-gitops-operator
      gitops-disable-default-argocd: 'true'
      gitops-channel: gitops-1.21   # AutoShift supports GitOps <= 1.21 (1.22 ships Helm 4, which breaks the policy-generator CMP)
      gitops-source: redhat-operators
      gitops-source-namespace: openshift-marketplace
      # gitops-namespace: 'openshift-gitops'  # Override ArgoCD namespace per-cluster
      ### Master Nodes
      master-nodes: 'true'
      master-max-pods: 500
      ### Storage Nodes
      # storage-nodes: '1'   # lab: single node, no dedicated storage nodes
      # storage-nodes-provider: baremetal
      ### Machine Health Checks
      machine-health-checks: 'false'
      machine-health-checks-worker: 'false'
      machine-health-checks-infra: 'false'
      machine-health-checks-storage: 'false'
      ### MetalLB
      metallb: 'false'   # lab: API/ingress use the node IP; no address pools defined
      metallb-subscription-name: metallb-operator
      # metallb-version: 'metallb-operator.v4.22.0-202608251608'
      metallb-source: redhat-operators
      metallb-source-namespace: openshift-marketplace
      metallb-channel: stable
      metallb-quota: 'false'
      # Set your quota if metallb-quota is enabled
      metallb-quota-cpu: ''
      metallb-quota-memory:
      # Specify the names of your IPPool files here
      metallb-ippool-1: ''
      #Specify your L2 Advertisement files here
      metallb-l2-1: ''
      # Specify the names of your BGP Advertisement files here
      metallb-bgp-1: ''
      # Specify the names of your Peer files here
      metallb-peer-1: ''
      ### Ansible Automation Platform
      aap: 'false'
      aap-subscription-name: ansible-automation-platform-operator
      aap-channel: stable-2.7
      aap-install-plan-approval: Automatic
      aap-source: redhat-operators
      aap-source-namespace: openshift-marketplace
      ### Kubernetes NMState Operator
      nmstate: 'false'
      nmstate-subscription-name: kubernetes-nmstate-operator
      nmstate-channel: stable
      nmstate-source: redhat-operators
      nmstate-source-namespace: openshift-marketplace
      # nmstate-version: 'kubernetes-nmstate-operator.4.22.0-202608260901'
      #
      # Identifiers ({id}, {M}) can be numbers or names (e.g., '1', 'mgmt', 'storage').
      # CONSTRAINT: Identifiers must NOT contain hyphens (-).
      # Generated NNCPs: nmstate-bond-{id}, nmstate-vlan-{id}, nmstate-ethernet-{id},
      #                  nmstate-ovs-bridge-{id}, nmstate-network-config
      #
      # === Bond Interface Configuration ===
      # nmstate-bond-{id}: Bond interface name (e.g., 'bond0')
      # nmstate-bond-{id}-mode: '802.3ad', 'active-backup', 'balance-rr', etc.
      # nmstate-bond-{id}-port-{M}: Port interface name (e.g., 'eno1')
      # nmstate-bond-{id}-mtu: MTU value (e.g., '9000')
      # nmstate-bond-{id}-mac: MAC address with dots (e.g., 'aa.bb.cc.dd.ee.ff')
      # nmstate-bond-{id}-miimon: MII monitoring interval in ms (e.g., '100')
      # nmstate-bond-{id}-ipv4: 'dhcp', 'static', or 'disabled'
      # nmstate-bond-{id}-ipv4-address-{M}: IP address (e.g., '192.168.1.10')
      # nmstate-bond-{id}-ipv4-address-{M}-cidr: CIDR prefix (e.g., '24')
      # nmstate-bond-{id}-ipv6: 'dhcp', 'autoconf', 'static', or 'disabled'
      #
      # === VLAN Interface Configuration ===
      # nmstate-vlan-{id}: VLAN interface name (e.g., 'bond0.100')
      # nmstate-vlan-{id}-id: VLAN ID (e.g., '100')
      # nmstate-vlan-{id}-base: Base interface (e.g., 'bond0')
      # nmstate-vlan-{id}-ipv4: 'dhcp', 'static', or 'disabled'
      #
      # === Static Routes ===
      # nmstate-route-{id}-dest: Destination network (e.g., '10.0.0.0')
      # nmstate-route-{id}-cidr: CIDR prefix (e.g., '8')
      # nmstate-route-{id}-gateway: Next hop (e.g., '192.168.1.1')
      # nmstate-route-{id}-interface: Outgoing interface (e.g., 'bond0')
      #
      # === DNS Configuration ===
      # nmstate-dns-server-{id}: DNS server IP (e.g., '8.8.8.8')
      # nmstate-dns-search-{id}: Search domain (e.g., 'example.com')
      #
      # === Node Selector ===
      # nmstate-nodeselector-{id}-prefix: Label prefix (e.g., 'node-role.kubernetes.io') - optional
      # nmstate-nodeselector-{id}-name: Label name (e.g., 'worker')
      # nmstate-nodeselector-{id}-value: Label value (e.g., '')
      #
      # === OVS Bridge Configuration (for UDN/localnet) ===
      # nmstate-ovs-bridge-{id}: OVS bridge name (e.g., 'ovs-br1')
      # nmstate-ovs-bridge-{id}-port-{M}: Port interface (e.g., 'eth1', 'bond0')
      # nmstate-ovs-bridge-{id}-stp: Spanning tree protocol (default: 'false')
      # nmstate-ovs-bridge-{id}-allow-extra-patch-ports: Allow OVN patch ports (default: 'true')
      # nmstate-ovs-bridge-{id}-mcast-snooping: Multicast snooping (optional)
      #
      # === OVN Bridge Mapping (for UDN localnet topology) ===
      # nmstate-ovn-mapping-{id}-localnet: Localnet name for UDN (e.g., 'localnet1')
      # nmstate-ovn-mapping-{id}-bridge: OVS bridge to map (e.g., 'ovs-br1')
      #
      # === Host-Specific Configuration ===
      # For per-host configs (different IPs per node), use the nmstate-host-{id} prefix:
      # nmstate-host-{id}-hostname: Target hostname (e.g., 'worker-0.ocp.example.com')
      # nmstate-host-{id}-bond-{id}: Bond name for this host
      # nmstate-host-{id}-bond-{id}-mode: Bond mode
      # nmstate-host-{id}-bond-{id}-port-{M}: Bond port
      # nmstate-host-{id}-bond-{id}-ipv4: 'dhcp', 'static', or 'disabled'
      # nmstate-host-{id}-bond-{id}-ipv4-address-{M}: Static IP for this host
      # nmstate-host-{id}-bond-{id}-ipv4-address-{M}-cidr: CIDR prefix
      # (Same pattern for vlan, ethernet, ovs-bridge, ovn-mapping, route, dns)
      ### LVM Operator
      lvm: 'false'   # hub LVMS was installed manually (openshift-lvm-storage) and holds the hub PVs; AutoShift's LVMS policy is hardcoded to openshift-storage and would clash
      lvm-subscription-name: lvms-operator
      lvm-default: 'true'
      lvm-fstype: xfs
      lvm-size-percent: 90
      lvm-overprovision-ratio: 10
      lvm-channel: stable-4.22
      lvm-source: redhat-operators
      lvm-source-namespace: openshift-marketplace
      ### Local Storage Operator
      local-storage: 'false'
      local-storage-subscription-name: local-storage-operator
      local-storage-channel: stable
      local-storage-source: redhat-operators
      local-storage-source-namespace: openshift-marketplace
      ### OpenShift Data Foundation
      odf: 'false'   # lab: LVMS on vdb instead (ODF needs more disks/RAM than this SNO has)
      odf-subscription-name: odf-operator
      odf-multi-cloud-gateway: standalone
      # odf-nooba-pvpool: ''
      # odf-nooba-store-size: ''
      # odf-nooba-store-num-volumes: ''
      # odf-ocs-storage-class-name: ''
      # odf-ocs-storage-size: ''
      # odf-ocs-storage-count: ''
      # odf-ocs-storage-replicas: ''
      # odf-resource-profile: ''
      odf-channel: stable-4.22
      odf-source: redhat-operators
      odf-source-namespace: openshift-marketplace
      ### OpenShift Internal Registry
      imageregistry: 'true'
      imageregistry-management-state: Managed
      imageregistry-replicas: '1'
      imageregistry-storage-type: pvc   # lab: no ODF/NooBaa, so back the registry with an LVMS PVC
      imageregistry-pvc-access-mode: ReadWriteOnce
      imageregistry-pvc-size: 30Gi
      imageregistry-pvc-storage-class: lvms-vg1
      imageregistry-pvc-volume-mode: Filesystem
      imageregistry-rollout-strategy: Recreate   # RWO volume can't be shared during a rolling update
      ### Advanced Cluster Security
      acs: 'false'
      acs-subscription-name: rhacs-operator
      acs-channel: stable
      acs-source: redhat-operators
      acs-source-namespace: openshift-marketplace
      ### Developer Spaces
      dev-spaces: 'false'
      dev-spaces-subscription-name: devspaces
      dev-spaces-channel: stable
      dev-spaces-source: redhat-operators
      dev-spaces-source-namespace: openshift-marketplace
      ### Developer Hub
      dev-hub: 'false'
      dev-hub-subscription-name: rhdh
      dev-hub-channel: fast-1.10
      dev-hub-source: redhat-operators
      dev-hub-source-namespace: openshift-marketplace
      ### OpenShift Pipelines
      pipelines: 'false'
      pipelines-subscription-name: openshift-pipelines-operator-rh
      pipelines-channel: pipelines-1.23
      pipelines-source: redhat-operators
      pipelines-source-namespace: openshift-marketplace
      ### Trusted Artifact Signer
      tas: 'false'
      tas-subscription-name: rhtas-operator
      tas-channel:  stable
      tas-source: redhat-operators
      tas-source-namespace: openshift-marketplace
      ### Quay
      quay: 'false'
      quay-subscription-name: quay-operator
      quay-channel: stable-3.18
      quay-install-plan-approval: Automatic
      quay-source: redhat-operators
      quay-source-namespace: openshift-marketplace
      ### Developer OpenShift Gitops
      gitops-dev: 'false'   # lab: skip the extra developer Argo CD instance to save hub memory
      ### Loki
      loki: 'false'
      loki-subscription-name: loki-operator
      loki-channel: stable-6.6
      loki-install-plan-approval: Automatic
      loki-source: redhat-operators
      loki-source-namespace: openshift-marketplace
      loki-size: 1x.extra-small
      loki-storageclass: lvms-vg1
      loki-lokistack-name: logging-lokistack
      ### OpenShift Logging
      logging: 'false'
      logging-subscription-name: cluster-logging
      logging-channel: stable-6.6
      logging-install-plan-approval: Automatic
      logging-source: redhat-operators
      logging-source-namespace: openshift-marketplace
      ### Cluster Observability Operator
      coo: 'false'
      coo-subscription-name: cluster-observability-operator
      coo-channel: stable
      coo-source: redhat-operators
      coo-source-namespace: openshift-marketplace
      ### Compliance Operator Stig Apply
      compliance: 'false'
      compliance-auto-remediate: 'false'
      compliance-subscription-name: compliance-operator
      compliance-source: redhat-operators
      compliance-source-namespace: openshift-marketplace
      compliance-channel: stable
      ### Migration Toolkit for Openshift Virtualization
      mtv: 'false'   # lab: not needed, saves hub memory
      mtv-subscription-name: mtv-operator
      mtv-channel: release-v2.12
      mtv-source: redhat-operators
      mtv-source-namespace: openshift-marketplace
      mtv-version: 'mtv-operator.v2.12.7'
      ### node-maintenance
      node-maintenance: 'false'   # lab: single node, nothing to drain to
      node-maintenance-subscription-name: node-maintenance-operator
      node-maintenance-channel: stable
      node-maintenance-source: redhat-operators
      node-maintenance-source-namespace: openshift-marketplace
      node-maintenance-version: 'node-maintenance-operator.v5.7.1'
      ### external-secrets-operator
      external-secrets-operator: 'true'
      external-secrets-operator-subscription-name: openshift-external-secrets-operator
      external-secrets-operator-channel: stable-v1
      external-secrets-operator-source: redhat-operators
      external-secrets-operator-source-namespace: openshift-marketplace

      ### Red Hat build of Keycloak (rhbk namespace): operator + standalone Postgres + Keycloak
      rhbk: 'true'
      rhbk-subscription-name: rhbk-operator
      rhbk-channel: stable-v26.6
      rhbk-source: redhat-operators
      rhbk-source-namespace: openshift-marketplace
      rhbk-db-size: 5Gi
